<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- 
    Large developer closing-tag </ > pattern for ProfileCard luminance mask.
    Drawn with thick paths and scattered across the canvas to match the reference image.
  -->
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Center-right large tag -->
    <g transform="translate(450, 150) rotate(15) scale(1.8)" opacity="0.85" stroke-width="8">
      <polyline points="40,0 0,40 40,80" />
      <line x1="60" y1="80" x2="100" y2="0" />
      <polyline points="120,0 160,40 120,80" />
    </g>

    <!-- Center-left large tag -->
    <g transform="translate(80, 280) rotate(-10) scale(1.5)" opacity="0.75" stroke-width="9">
      <polyline points="40,0 0,40 40,80" />
      <line x1="60" y1="80" x2="100" y2="0" />
      <polyline points="120,0 160,40 120,80" />
    </g>

    <!-- Bottom center huge tag -->
    <g transform="translate(250, 500) rotate(-5) scale(2.2)" opacity="0.9" stroke-width="7">
      <polyline points="40,0 0,40 40,80" />
      <line x1="60" y1="80" x2="100" y2="0" />
      <polyline points="120,0 160,40 120,80" />
    </g>

    <!-- Top left medium tag -->
    <g transform="translate(50, 50) rotate(-20) scale(1.2)" opacity="0.6" stroke-width="10">
      <polyline points="40,0 0,40 40,80" />
      <line x1="60" y1="80" x2="100" y2="0" />
      <polyline points="120,0 160,40 120,80" />
    </g>

    <!-- Bottom right medium tag -->
    <g transform="translate(550, 600) rotate(25) scale(1.3)" opacity="0.65" stroke-width="9">
      <polyline points="40,0 0,40 40,80" />
      <line x1="60" y1="80" x2="100" y2="0" />
      <polyline points="120,0 160,40 120,80" />
    </g>

    <!-- Far right middle tag -->
    <g transform="translate(650, 350) rotate(-15) scale(1.4)" opacity="0.7" stroke-width="8">
      <polyline points="40,0 0,40 40,80" />
      <line x1="60" y1="80" x2="100" y2="0" />
      <polyline points="120,0 160,40 120,80" />
    </g>

    <!-- Bottom left small tag -->
    <g transform="translate(-20, 650) rotate(10) scale(1.1)" opacity="0.5" stroke-width="11">
      <polyline points="40,0 0,40 40,80" />
      <line x1="60" y1="80" x2="100" y2="0" />
      <polyline points="120,0 160,40 120,80" />
    </g>
    
    <!-- Top right small tag -->
    <g transform="translate(680, 20) rotate(5) scale(1.0)" opacity="0.5" stroke-width="12">
      <polyline points="40,0 0,40 40,80" />
      <line x1="60" y1="80" x2="100" y2="0" />
      <polyline points="120,0 160,40 120,80" />
    </g>

  </g>
</svg>
